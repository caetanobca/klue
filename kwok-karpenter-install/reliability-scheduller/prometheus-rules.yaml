apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reliability-scheduler-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: reliability_scheduler
    interval: 15s
    rules:
    # Etapa 1: anexa label "app" (nome do deployment) a cada série de owner
    - record: pod:owner:with_app_label
      expr: |
        label_replace(
          kube_pod_owner{owner_kind="ReplicaSet"},
          "app",
          "$1",
          "owner_name",
          "(.+)-[0-9a-f]+$"
        )

    # Etapa 2: conta TOTAL de pods por app/namespace
    - record: deployment:pods_total:count
      expr: |
        count by (app, namespace) (pod:owner:with_app_label)

    # Etapa 3: conta pods Running por app/namespace
    - record: deployment:pods_running:count
      expr: |
        sum by (app, namespace) (
          (kube_pod_status_phase{phase="Running"} == 1)
          * on(pod, namespace) group_left(app)
          pod:owner:with_app_label
        )
        or
        (0 * deployment:pods_total:count)

    # Etapa 4: indica falha quando running < total (preserva labels via on(namespace, app))
    - record: deployment:has_failure
      expr: |
        deployment:pods_running:count
          < bool on (namespace, app)
        deployment:pods_total:count

    # Etapa 5: calcula horas por falha por app/namespace e preserva labels
    - record: app:reliability:hour_per_failure:1h
      expr: |
        sum by (app, namespace) (
          (
            ((changes(deployment:has_failure[1h]) / 2) > 0)
            * (1 / (changes(deployment:has_failure[1h]) / 2))
          )
        )
        or on (app, namespace)
        (
          deployment:pods_total:count * 0 + 2
        )
