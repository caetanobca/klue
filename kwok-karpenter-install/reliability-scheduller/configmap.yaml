apiVersion: v1
kind: ConfigMap
metadata:
  name: reliability-scheduler-config
  namespace: kube-scheduler-reliability
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: true
      resourceName: reliability-scheduler
      resourceNamespace: kube-scheduler-reliability
    profiles:
      - schedulerName: reliability-scheduler
        plugins:
          preFilter:
            enabled:
              - name: TimingPlugin        # FIRST: captures cycle start timestamp
              - name: NodeResourcesFit
              - name: NodePorts
              - name: VolumeBinding
              - name: PodTopologySpread
              - name: InterPodAffinity
              - name: VolumeZone
              - name: NodeAffinity
              - name: ReliabilityScheduler

          filter:
            enabled:
              - name: NodeUnschedulable
              - name: NodeName
              - name: TaintToleration
              - name: NodeAffinity
              - name: NodePorts
              - name: NodeResourcesFit
              - name: VolumeRestrictions
              - name: EBSLimits
              - name: GCEPDLimits
              - name: NodeVolumeLimits
              - name: AzureDiskLimits
              - name: VolumeBinding
              - name: VolumeZone
              - name: PodTopologySpread
              - name: InterPodAffinity
              - name: ReliabilityScheduler

          score:
            enabled:
              - name: NodeResourcesBalancedAllocation
                weight: 1
              - name: ImageLocality
                weight: 1
              - name: InterPodAffinity
                weight: 1
              - name: NodeResourcesFit
                weight: 1
              - name: NodeAffinity
                weight: 1
              - name: PodTopologySpread
                weight: 2
              - name: TaintToleration
                weight: 1
              - name: ReliabilityScheduler
                weight: 10

          permit:
            enabled:
              - name: TimingPlugin        # logs total cycle duration, always allows

        pluginConfig:
          - name: ReliabilityScheduler
            args:
              apiVersion: kubescheduler.config.k8s.io/v1
              kind: ReliabilitySchedulerArgs
              intercept: 0.0
              spreadWeight: 0.0
              hourPerFailureWeight: 0.0
              totalNodesWeight: 0.0
              spreadSmallApps: 0.0
              interceptSmallApps: 0.0
